name: Build Study Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Download & Bundle All 3 Native Tools (N_m3u8DL-RE, mp4decrypt, FFmpeg)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          
          # 1. Download N_m3u8DL-RE (Android Bionic ARM64)
          echo "=== 1/3: Fetching N_m3u8DL-RE for Android ARM64 ==="
          curl -s https://api.github.com/repos/nilaoda/N_m3u8DL-RE/releases/latest | \
            grep -o "https://[^\"]*android-bionic-arm64[^\"]*\.tar\.gz" | head -n 1 | xargs -r curl -sL -o n_m3u8dl.tar.gz || true
          
          if [ ! -f n_m3u8dl.tar.gz ] || [ ! -s n_m3u8dl.tar.gz ]; then
            echo "Using direct fallback URL for N_m3u8DL-RE..."
            curl -sL "https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.3.0-beta/N_m3u8DL-RE_Beta_android-bionic-arm64.tar.gz" -o n_m3u8dl.tar.gz || \
            curl -sL "https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.2.0-beta/N_m3u8DL-RE_Beta_android-bionic-arm64.tar.gz" -o n_m3u8dl.tar.gz || true
          fi
          
          if [ -f n_m3u8dl.tar.gz ] && [ -s n_m3u8dl.tar.gz ]; then
            tar -xzf n_m3u8dl.tar.gz
            find . -name "N_m3u8DL-RE*" -type f -exec mv {} android/app/src/main/jniLibs/arm64-v8a/libn_m3u8dl.so \;
            chmod +x android/app/src/main/jniLibs/arm64-v8a/libn_m3u8dl.so
            echo "[SUCCESS] N_m3u8DL-RE embedded in jniLibs as libn_m3u8dl.so!"
          fi
          
          # 2. Build Bento4 mp4decrypt for Android ARM64
          echo "=== 2/3: Compiling Bento4 mp4decrypt for Android ARM64 ==="
          NDK_PATH=""
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          else
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
          fi
          
          echo "Found Android NDK at: $NDK_PATH"
          if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
            git clone --depth 1 https://github.com/axiomatic-systems/Bento4.git
            mkdir -p Bento4/build_arm64 && cd Bento4/build_arm64
            cmake -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI=arm64-v8a \
                  -DANDROID_PLATFORM=android-26 \
                  -DCMAKE_BUILD_TYPE=Release ..
            cmake --build . --target mp4decrypt -j$(nproc)
            cd ../..
            if [ -f Bento4/build_arm64/mp4decrypt ]; then
              cp Bento4/build_arm64/mp4decrypt android/app/src/main/jniLibs/arm64-v8a/libmp4decrypt.so
              chmod +x android/app/src/main/jniLibs/arm64-v8a/libmp4decrypt.so
              echo "[SUCCESS] mp4decrypt compiled and embedded as libmp4decrypt.so!"
            fi
            rm -rf Bento4
          fi

          # 3. Download FFmpeg static binary for Android ARM64
          echo "=== 3/3: Fetching FFmpeg for Android ARM64 ==="
          curl -sL "https://github.com/hzw1199/Android-FFmpeg-Prebuilt/raw/master/ffmpeg-v5.1.2-arm64-v8a" -o android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so || true
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so || true
          
          echo "--- Embedded Native Tools Verification ---"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study_Pro_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
